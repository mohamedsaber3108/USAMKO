# Nginx WebSocket Configuration for USAMKO
# Add this to your existing server block in /etc/nginx/sites-available/usamko
#
# Usage: Copy the location block below into your existing nginx config
#        Then: sudo nginx -t && sudo systemctl reload nginx

# Add these to the top of your nginx config (outside server block):
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     '' close;
# }

# Add this location block inside your existing server { } block:

# WebSocket endpoint for Chrome Extension token capture
location /token-capture {
    proxy_pass http://127.0.0.1:3000/token-capture;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}
