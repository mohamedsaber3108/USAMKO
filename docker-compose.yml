version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: usamko-postgres
    environment:
      POSTGRES_USER: usamko
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: usamko_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usamko"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: usamko-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: usamko-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: usamko
      RABBITMQ_DEFAULT_PASS: dev_password_change_in_production
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: usamko-minio
    environment:
      MINIO_ROOT_USER: usamko
      MINIO_ROOT_PASSWORD: dev_password_change_in_production
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console (http://localhost:9001)
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
