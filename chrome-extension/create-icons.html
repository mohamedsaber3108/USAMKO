<!DOCTYPE html>
<html>
<head>
    <title>Generate Extension Icons</title>
</head>
<body>
    <canvas id="canvas" width="128" height="128"></canvas>
    <script>
        // Generate icons at different sizes
        const sizes = [16, 48, 128];

        sizes.forEach(size => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;

            // Rounded rectangle
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.fill();

            // Map pin
            ctx.fillStyle = 'white';
            ctx.globalAlpha = 0.95;
            const pinX = size / 2;
            const pinY = size * 0.4;
            const pinSize = size * 0.25;

            ctx.beginPath();
            ctx.moveTo(pinX, pinY - pinSize);
            ctx.bezierCurveTo(
                pinX - pinSize, pinY - pinSize,
                pinX - pinSize, pinY,
                pinX, pinY + pinSize
            );
            ctx.bezierCurveTo(
                pinX + pinSize, pinY,
                pinX + pinSize, pinY - pinSize,
                pinX, pinY - pinSize
            );
            ctx.fill();

            // Inner circle
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#667eea';
            ctx.beginPath();
            ctx.arc(pinX, pinY, size * 0.06, 0, Math.PI * 2);
            ctx.fill();

            // "U" letter
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.25}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('U', pinX, size * 0.85);

            // Download
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon${size}.png`;
                a.click();
            });
        });

        document.body.innerHTML = '<h1>Icons generated! Check your downloads folder.</h1>';
    </script>
</body>
</html>
